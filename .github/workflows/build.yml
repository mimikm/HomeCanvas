name: Build APK

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach the APK to (e.g. 0.2.0). Leave empty for a normal build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  BUILD_REF: ${{ inputs.release_tag || github.ref }}
  BUILD_NAME: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          NAME="${BUILD_NAME//\//-}"
          if [[ "$NAME" =~ ^v?[0-9] ]]; then NAME="v${NAME#v}"; fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/homecanvas-${NAME}.apk"
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: homecanvas-apk
          path: out/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_NAME }}
          files: out/*.apk
