plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mimikm.homecanvas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mimikm.homecanvas'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            // Optional: set these env vars (GitHub secrets) for a stable signing key,
            // so updates install over the top without uninstalling first.
            def ks = System.getenv('SIGNING_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SIGNING_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
